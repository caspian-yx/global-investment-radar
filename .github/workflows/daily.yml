name: Daily Radar

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: Data mode
        required: true
        default: live
        type: choice
        options:
          - live
          - demo
      run_mode:
        description: AI execution mode
        required: true
        default: no-ai
        type: choice
        options:
          - no-ai
          - ai
      localization_mode:
        description: Chinese briefing localization (requires run_mode ai)
        required: true
        default: off
        type: choice
        options:
          - off
          - zh-CN
  schedule:
    # 22:17 UTC = 06:17 Asia/Shanghai on the following calendar day.
    # The non-zero minute reduces peak-hour delay risk; GitHub schedules are best effort.
    - cron: "17 22 * * *"

permissions:
  contents: read

concurrency:
  group: daily-investment-radar
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      DATA_MODE: ${{ inputs.data_mode || 'live' }}
      RUN_MODE: ${{ inputs.run_mode || 'ai' }}
      BUSINESS_TIMEZONE: Asia/Shanghai
      LOOKBACK_HOURS: "48"
      AI_ENABLED: "true"
      DAILY_LLM_BUDGET: "1"
      AI_MAX_REQUESTS_PER_RUN: "10"
      LLM_PROVIDER: deepseek
      LLM_MODEL: "deepseek-v4-flash"
      LOCALIZATION_ENABLED: ${{ inputs.localization_mode == 'zh-CN' && 'true' || 'false' }}
      LOCALIZATION_LOCALE: zh-CN
      LOCALIZATION_MODEL: "deepseek-v4-flash"
      EMAIL_MODE: smtp
      REPORT_OUTPUT_DIR: outputs/reports
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --extra postgres --locked
      - name: Show safe effective configuration
        env:
          AI_ENABLED: ${{ inputs.run_mode == 'no-ai' && 'false' || 'true' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///work/radar.db' }}
        run: uv run radar doctor
      - name: Run live AI radar and deliver email
        shell: bash
        env:
          AI_ENABLED: ${{ inputs.run_mode == 'no-ai' && 'false' || 'true' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///work/radar.db' }}
        run: |
          set -o pipefail
          if [[ "$LOCALIZATION_ENABLED" == "true" && "$RUN_MODE" != "ai" ]]; then
            echo "Chinese localization requires run_mode=ai" >&2
            exit 2
          fi
          mkdir -p outputs
          if [[ "$RUN_MODE" == "no-ai" ]]; then
            uv run radar daily \
              2> >(tee outputs/run-diagnostics.log >&2) \
              | tee outputs/run-result.json
          else
            uv run radar daily --ai \
              2> >(tee outputs/run-diagnostics.log >&2) \
              | tee outputs/run-result.json
          fi
      - name: Upload report and run result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: global-investment-radar-${{ github.run_id }}
          path: |
            outputs/reports/**/*.html
            outputs/run-result.json
            outputs/run-diagnostics.log
          retention-days: 14
          if-no-files-found: error
